<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d3df5"/>
      <stop offset="0.55" stop-color="#3b6cf6"/>
      <stop offset="1" stop-color="#14c8d6"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dff5ff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1030" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- squircle background -->
  <path d="M256 20c132 0 236 0 236 236s-104 236-236 236S20 388 20 256 124 20 256 20z" fill="url(#bg)"/>
  <!-- subtle sheen -->
  <path d="M60 130C120 70 200 52 300 60c-70 30-150 60-240 150z" fill="#ffffff" opacity="0.12"/>
  <!-- open book -->
  <g filter="url(#sh)">
    <path d="M256 168c-34-26-82-36-134-30v190c52-6 100 4 134 30z" fill="url(#page)"/>
    <path d="M256 168c34-26 82-36 134-30v190c-52-6-100 4-134 30z" fill="url(#page)" opacity="0.92"/>
    <path d="M256 168v190" stroke="#3b6cf6" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- text lines (left page: devanagari-like ticks, right page: latin-like) -->
  <g stroke="#3b6cf6" stroke-width="10" stroke-linecap="round" opacity="0.75">
    <path d="M154 200h70M154 232h58M154 264h70M154 296h48"/>
    <path d="M288 200h70M288 232h52M288 264h70M288 296h60"/>
  </g>
  <!-- rising translate arrow / spark -->
  <g transform="translate(256 120)">
    <circle r="46" fill="#ffffff"/>
    <path d="M-22 6l14 14 30-32" fill="none" stroke="#3b6cf6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- bottom swoosh -->
  <path d="M120 400c60 40 212 40 272 0" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
</svg>
